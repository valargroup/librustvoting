[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
# Keep Orchard aligned with the release used by the pinned librustzcash revision,
# so voting-circuits and the wallet dependencies resolve to one Orchard node.
orchard = { version = "0.15.0", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.8.0", git = "https://github.com/valargroup/voting-circuits", rev = "f160effd7a83fb75e76c17aa8f1a9fa3f31e0423" }

pczt = { version = "0.8.0-rc.1", git = "https://github.com/zcash/librustzcash", rev = "e58f13ec03f2f1e8834ab5710623a63e542ebad1", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_client_backend = { version = "0.24.0-rc.1", git = "https://github.com/zcash/librustzcash", rev = "e58f13ec03f2f1e8834ab5710623a63e542ebad1", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.22.0-rc.1", git = "https://github.com/zcash/librustzcash", rev = "e58f13ec03f2f1e8834ab5710623a63e542ebad1", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.15.0-pre.0", git = "https://github.com/zcash/librustzcash", rev = "e58f13ec03f2f1e8834ab5710623a63e542ebad1", features = ["orchard"] }
zcash_primitives = { version = "0.29.0-pre.0", git = "https://github.com/zcash/librustzcash", rev = "e58f13ec03f2f1e8834ab5710623a63e542ebad1" }
zcash_protocol = { version = "0.10.0-pre.0", git = "https://github.com/zcash/librustzcash", rev = "e58f13ec03f2f1e8834ab5710623a63e542ebad1" }

[patch.crates-io]
# The pinned zcash_client_backend builds against the checkpoint-retention
# shardtree API that has no published release yet; mirror librustzcash's own
# `[patch.crates-io]` for shardtree and incrementalmerkletree.
shardtree = { git = "https://github.com/zcash/incrementalmerkletree", rev = "decefc469dbf1e686b20b7e7dcaa7cb4f122125b" }
incrementalmerkletree = { git = "https://github.com/zcash/incrementalmerkletree", rev = "decefc469dbf1e686b20b7e7dcaa7cb4f122125b" }
