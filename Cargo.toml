[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
orchard = { version = "0.14", git = "https://github.com/valargroup/qr_orchard", rev = "6f1a5eaddcf0e016101c0c62a477d48f31e7a83f", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.8.0", git = "https://github.com/valargroup/voting-circuits", rev = "b9c746083577092865b013e08cc35a974328afcb" }

pczt = { version = "0.7", git = "https://github.com/valargroup/librustzcash", rev = "505e5337e444da07277de1aa13f9e5558a0c781a", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_client_backend = { version = "0.23", git = "https://github.com/valargroup/librustzcash", rev = "505e5337e444da07277de1aa13f9e5558a0c781a", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.21", git = "https://github.com/valargroup/librustzcash", rev = "505e5337e444da07277de1aa13f9e5558a0c781a", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.14", git = "https://github.com/valargroup/librustzcash", rev = "505e5337e444da07277de1aa13f9e5558a0c781a", features = ["orchard"] }
zcash_primitives = { version = "0.28", git = "https://github.com/valargroup/librustzcash", rev = "505e5337e444da07277de1aa13f9e5558a0c781a" }
zcash_protocol = { version = "0.9", git = "https://github.com/valargroup/librustzcash", rev = "505e5337e444da07277de1aa13f9e5558a0c781a" }
