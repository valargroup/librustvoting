[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
orchard = { version = "0.14", git = "https://github.com/valargroup/qr_orchard", rev = "89d46956a3ae58cd2af170edace8a2f5d7a7715f", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.8.0", git = "https://github.com/valargroup/voting-circuits", rev = "9e7957028c5835da689112d7084ec9b283c9c1e3" }

pczt = { version = "0.7", git = "https://github.com/valargroup/librustzcash", rev = "8f242680358a2db7a6df42a629c8dd3d5cb4d737", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_client_backend = { version = "0.23", git = "https://github.com/valargroup/librustzcash", rev = "8f242680358a2db7a6df42a629c8dd3d5cb4d737", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.21", git = "https://github.com/valargroup/librustzcash", rev = "8f242680358a2db7a6df42a629c8dd3d5cb4d737", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.14", git = "https://github.com/valargroup/librustzcash", rev = "8f242680358a2db7a6df42a629c8dd3d5cb4d737", features = ["orchard"] }
zcash_primitives = { version = "0.28", git = "https://github.com/valargroup/librustzcash", rev = "8f242680358a2db7a6df42a629c8dd3d5cb4d737" }
zcash_protocol = { version = "0.9", git = "https://github.com/valargroup/librustzcash", rev = "8f242680358a2db7a6df42a629c8dd3d5cb4d737" }
