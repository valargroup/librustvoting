[workspace]
members = [
    "zcash_voting",
    "zcash_voting-zakura",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
# zcash_voting-zakura shares `voting-crypto-deps` with zcash_voting via one
# Cargo.lock, and the two request mutually exclusive features of it. Without
# `default-members`, a bare `cargo check`/`cargo test` (no `-p`/`--workspace`)
# defaults to every member on a virtual manifest and hits that clash. Keep it
# out of the default set; `--workspace` or `-p zcash_voting-zakura` still
# reach it explicitly.
default-members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
# orchard, voting-circuits, and librustzcash all resolve to the same Orchard
# release, keeping the dependency graph type-compatible across PCZT construction
# and vote proofs.
orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.10.3", default-features = false }
voting-crypto-deps = { version = "=0.1.2", default-features = false }

# These published librustzcash versions include the Ironwood historical selector.
pczt = { version = "0.9.2", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_client_backend = { version = "0.24.0-rc.7", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.22.0-rc.7", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.16.1", features = ["orchard"] }
zcash_primitives = { version = "0.30.0" }
zcash_protocol = { version = "0.10.4" }

[profile.test.package.imt-tree]
opt-level = 3

[profile.test.package.valar-ypir]
opt-level = 3

[profile.test.package.valar-spiral-rs]
opt-level = 3
