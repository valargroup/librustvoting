[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
# orchard, voting-circuits, and librustzcash all resolve to the same Orchard
# release, keeping the dependency graph type-compatible across PCZT construction
# and vote proofs.
orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.10.0", default-features = false }
voting-crypto-deps = { version = "=0.1.0", default-features = false }
zakura-wallet-lib = { version = "0.1.0-rc0", default-features = false }

# These published librustzcash versions include the Ironwood historical selector.
pczt = { version = "0.9.2", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_client_backend = { version = "0.24.0-rc.7", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.22.0-rc.7", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.16.1", features = ["orchard"] }
zcash_primitives = { version = "0.30.0" }
zcash_protocol = { version = "0.10.4" }

[patch.crates-io]
imt-tree = { git = "https://github.com/valargroup/vote-nullifier-pir", rev = "3a89f2838e64475746805c25a2f999c8dc96adff" }
pir-client = { git = "https://github.com/valargroup/vote-nullifier-pir", rev = "3a89f2838e64475746805c25a2f999c8dc96adff" }
pir-types = { git = "https://github.com/valargroup/vote-nullifier-pir", rev = "3a89f2838e64475746805c25a2f999c8dc96adff" }
voting-circuits = { git = "https://github.com/valargroup/voting-circuits", rev = "83427979fccb8ae3bf010e21691742c78d283bc8" }
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits", rev = "83427979fccb8ae3bf010e21691742c78d283bc8" }
# Same libraries rev voting-crypto-deps already pins, so wallet-lib's crates.io
# zakura-* crypto deps unify with the proving stack instead of compiling twice.
zakura-halo2-gadgets = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-halo2-legacy-pdqsort = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-halo2-poseidon = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-halo2-proofs = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-keys = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-orchard = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-pasta-curves = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-primitives = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-reddsa = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-redjubjub = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-sapling-crypto = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
zakura-sinsemilla = { git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db" }
