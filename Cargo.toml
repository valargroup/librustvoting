[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
orchard = { version = "0.14", git = "https://github.com/valargroup/qr_orchard", rev = "098ba2683dd05e5fb8fc5c45b9e7084aa1e2ad76", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.8.0", git = "https://github.com/valargroup/voting-circuits", rev = "8f5ea31aba3de0b90a9a38d9a91fa210cac15021" }

pczt = { version = "0.7", git = "https://github.com/valargroup/librustzcash", rev = "7f49c2fce728a37ab60e43820ddc1a379a39fbc0", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_client_backend = { version = "0.23", git = "https://github.com/valargroup/librustzcash", rev = "7f49c2fce728a37ab60e43820ddc1a379a39fbc0", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.21", git = "https://github.com/valargroup/librustzcash", rev = "7f49c2fce728a37ab60e43820ddc1a379a39fbc0", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.14", git = "https://github.com/valargroup/librustzcash", rev = "7f49c2fce728a37ab60e43820ddc1a379a39fbc0", features = ["orchard"] }
zcash_primitives = { version = "0.28", git = "https://github.com/valargroup/librustzcash", rev = "7f49c2fce728a37ab60e43820ddc1a379a39fbc0" }
zcash_protocol = { version = "0.9", git = "https://github.com/valargroup/librustzcash", rev = "7f49c2fce728a37ab60e43820ddc1a379a39fbc0" }
