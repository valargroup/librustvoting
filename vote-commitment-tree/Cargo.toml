[package]
name = "vote-commitment-tree"
version = "0.3.2"
edition = "2021"
description = "Append-only Poseidon Merkle tree for Vote Authority Notes and Vote Commitments in the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[dependencies]
imt-tree = "=0.2.0"
pasta_curves = "0.5"
ff = "0.13"
halo2_gadgets = { version = "=0.5.0", default-features = false }
anyhow = "1.0"
incrementalmerkletree = "0.8.1"
shardtree = "0.6"
lazy_static = "1"
libc = "0.2"

[dev-dependencies]
rand = "0.8"
orchard = { version = "0.14", git = "https://github.com/valargroup/qr_orchard", branch = "ironwood-qr", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.8.0", git = "https://github.com/valargroup/voting-circuits", rev = "418ea519f4fca04c1bff06442edf920a3e1e41f3" }
