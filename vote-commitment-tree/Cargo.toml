[package]
name = "vote-commitment-tree"
version = "0.3.1"
edition = "2021"
description = "Append-only Poseidon Merkle tree for Vote Authority Notes and Vote Commitments in the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[dependencies]
imt-tree = "=0.2.0"
pasta_curves = "0.5"
ff = "0.13"
# Match voting-circuits' =0.5.0 (single halo2_gadgets node); only poseidon
# primitives are used here, unchanged across 0.4/0.5, and 0.4.0 is yanked.
halo2_gadgets = { version = "=0.5.0", default-features = false }
anyhow = "1.0"
incrementalmerkletree = "0.8.1"
shardtree = "0.6"
lazy_static = "1"
libc = "0.2"

[dev-dependencies]
rand = "0.8"
orchard = { version = "0.14", git = "https://github.com/valargroup/orchard", branch = "adam/pczt-recompute-helpers", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "0.8.0", git = "https://github.com/valargroup/voting-circuits", branch = "adam/qrorchard-protocol-api" }
