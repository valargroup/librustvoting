name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore tracked source mtimes
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = os.fsdecode(raw_path)
              timestamp = int(
                  subprocess.check_output(
                      ["git", "log", "-1", "--format=%ct", "--", path], text=True
                  ).strip()
              )
              os.utime(path, (timestamp, timestamp))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Cache test build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: test-target-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain*', '.cargo/config.toml') }}-${{ hashFiles('**/*.rs', '**/*.sql', '**/*.json') }}
          restore-keys: |
            test-target-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain*', '.cargo/config.toml') }}-
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138
      - name: Test workspace with fixtures
        # zcash_voting-zakura shares `voting-crypto-deps` with zcash_voting via
        # one Cargo.lock; a bare `--workspace` build would ask Cargo to
        # activate that dependency's mutually-exclusive upstream/zakura
        # features in the same resolve. Exclude it here; it's covered by the
        # zakura-wallet job below.
        run: |
          cargo nextest run --workspace --exclude zcash_voting-zakura \
            --features zcash_voting/test-fixtures \
            --partition count:${{ matrix.partition }}/2 \
            --locked
      - name: Test documentation
        if: matrix.partition == 1
        run: |
          cargo test --workspace --exclude zcash_voting-zakura --doc \
            --features zcash_voting/test-fixtures \
            --locked

  proofs:
    name: Halo2 proof tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138
      # The end-to-end delegation proof runs keygen plus proving, so it is
      # marked #[ignore] for the default suite and run here under --release.
      - name: Run ignored proof tests
        run: |
          cargo nextest run --release -p zcash_voting \
            --locked --run-ignored ignored-only

  zakura-vct:
    name: Zakura VCT backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138
      - name: Test Zakura VCT crates
        run: |
          cargo nextest run -p vote-commitment-tree -p vote-commitment-tree-client \
            --all-targets --no-default-features \
            --features vote-commitment-tree/zakura,vote-commitment-tree-client/zakura,vote-commitment-tree-client/cli \
            --locked
      - name: Check backend contracts
        run: |
          if cargo tree -p vote-commitment-tree -p vote-commitment-tree-client \
            -e all --prefix none --locked \
            | grep -Eq '^zakura-(pasta-curves|halo2-gadgets|halo2-poseidon|halo2-proofs|orchard|sinsemilla) v'; then
            echo "Zakura crypto crates entered the default upstream VCT graph"
            exit 1
          fi

          if cargo tree -p vote-commitment-tree -p vote-commitment-tree-client \
            -e all --prefix none --no-default-features \
            --features vote-commitment-tree/zakura,vote-commitment-tree-client/zakura,vote-commitment-tree-client/cli \
            --locked \
            | grep -Eq '^(pasta_curves|halo2_gadgets|halo2_poseidon|halo2_proofs|orchard|sinsemilla) v'; then
            echo "Upstream crypto crates entered the Zakura VCT graph"
            exit 1
          fi

          if cargo check -p vote-commitment-tree --no-default-features --locked; then
            echo "A crypto backend must be selected"
            exit 1
          fi

          if cargo check -p vote-commitment-tree --all-features --locked; then
            echo "The upstream and Zakura backends must remain mutually exclusive"
            exit 1
          fi

  zakura-wallet:
    name: Zakura wallet backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138
      - name: Test Zakura wallet stack
        # One invocation: nextest exits with an error on a run with zero
        # tests, and zcash-voting-wallet-example alone has none (it's an
        # example crate, no [[test]]/[[example]] of its own — see the
        # comment in zcash_voting-zakura/Cargo.toml). zcash_voting-zakura's
        # 592 lib unit tests keep the combined run non-empty; --all-targets
        # only matters for the example crate.
        run: |
          cargo nextest run -p zcash_voting-zakura -p zcash-voting-wallet-example \
            --all-targets --no-default-features --features zakura --locked
      - name: Check wallet backend contracts
        run: |
          # `zcash_voting` and `zcash_voting-zakura` are now separate crates
          # with unconditional (non-optional) family deps, so each graph is
          # pure by construction; these checks just confirm that stays true.
          if cargo tree -p zcash_voting -e all --prefix none --locked \
            | grep -Eq '^zakura-(pczt|client-backend|client-sqlite|orchard|keys|primitives) v'; then
            echo "Zakura wallet crates entered the upstream graph"
            exit 1
          fi

          if cargo tree -p zcash_voting-zakura -e all --prefix none --locked \
            | grep -Eq '^(pczt|zcash_client_backend|zcash_client_sqlite|orchard|zcash_keys|zcash_primitives) v'; then
            echo "Upstream wallet crates entered the Zakura graph"
            exit 1
          fi

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace at MSRV
        run: |
          cargo check --workspace --exclude zcash_voting-zakura --all-targets \
            --features zcash_voting/test-fixtures,vote-commitment-tree-client/cli \
            --locked
