[package]
name = "zcash_voting"
version = "0.10.1"
edition = "2021"
description = "Client-side library for Zcash shielded voting: ZKP delegation and vote-commitment proofs (Halo 2), ElGamal encryption, governance PCZT construction, Merkle witness generation, and SQLite round-state persistence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[features]
default = []
# PIR client surface for fetching IMT non-membership proofs over direct
# Hyper/Rustls HTTP.
pir = [
    "dep:imt-tree",
    "dep:pir-client",
    "dep:pir-types",
    "dep:valar-spiral-rs",
    "dep:valar-ypir",
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
]
# Vote commitment tree HTTP sync surface for VAN witness generation.
tree-sync = [
    "dep:imt-tree",
    "dep:vote-commitment-tree",
    "dep:vote-commitment-tree-client",
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:rustls",
    "dep:tonic",
    "dep:tokio",
    "zcash_client_backend/lightwalletd-tonic",
    "zcash_client_backend/lightwalletd-tonic-tls-webpki-roots",
]
# Legacy feature names kept as aliases during the wallet migration window.
client-pir = ["pir"]
client-tree-sync = ["tree-sync"]
# Backwards-compatible aggregate for consumers that already enable `client`.
client = ["pir", "tree-sync"]
# Downstream test-only helpers for setting up persisted voting state without
# depending on SQLite schema details.
test-fixtures = []

[dependencies]
# Curves (same as Orchard/Zcash)
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"

# Randomness
rand = "0.8"

# Hashing
blake2b_simd = "1"
# Match voting-circuits' =0.5.0 so the whole circuit stack unifies on a single
# halo2_gadgets node. This crate only uses halo2_gadgets::poseidon::primitives::*,
# which is unchanged across 0.4/0.5; 0.4.0 is yanked on crates.io, so a downstream
# fresh resolve (e.g. vizor) cannot select it.
halo2_gadgets = "=0.5.0"
halo2_proofs = "0.3"
sinsemilla = "0.1"

# Serialization
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"

# PIR (private nullifier exclusion proofs).
pir-client = { version = "=0.3.0", default-features = false, optional = true }
# Supply-chain pins for the Valar-owned PIR/tree dependency surface. These
# direct optional dependencies constrain the versions Cargo may resolve when
# the client features are enabled; they do not change whether upstream build
# scripts execute.
pir-types = { version = "=0.1.0", default-features = false, optional = true }
valar-spiral-rs = { version = "=0.5.2", default-features = false, optional = true }
valar-ypir = { version = "=0.1.5", default-features = false, optional = true }
imt-tree = { version = "=0.2.0", optional = true }

# Direct Hyper/Rustls HTTP transport. Behind `client-pir` and `client-tree-sync`.
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1", "http2"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
tonic = { version = "0.14", features = ["channel", "tls-webpki-roots", "tls-ring"], optional = true }

# Vote commitment tree (VAN witness generation). Behind `client-tree-sync`.
vote-commitment-tree = { path = "../vote-commitment-tree", version = "=0.3.1", optional = true }
vote-commitment-tree-client = { path = "../vote-commitment-tree-client", version = "=0.5.1", features = ["http"], optional = true }

# Storage
rusqlite = { version = "0.37", features = ["bundled"] }

# Error handling
anyhow = "1"
thiserror = "2"
zeroize = "1"

# Single orchard node: every consumer resolves `orchard` from the
# valargroup/orchard `adam/pczt-recompute-helpers` branch (0.14), the same
# source the librustzcash `adam/pczt-optional-fields` foundation uses. The
# `[patch.crates-io]` in the workspace root redirects the crates.io `orchard`
# requirement of `voting-circuits` onto this git source so the graph keeps a
# single orchard node. The `unstable-voting-circuits` feature is required by
# integration tests in `zkp1.rs` (`Note::new`, `Note::dummy`,
# `Rho::from_nf_old`).
subtle = "2.6"
orchard = { version = "0.14", git = "https://github.com/valargroup/orchard", branch = "adam/pczt-recompute-helpers", features = ["unstable-voting-circuits"] }
# voting-circuits PR #94 head (adam/qrorchard-protocol-api): pinned to git so it
# builds against the valargroup/orchard recompute-helpers line (its orchard dep
# also points at adam/pczt-recompute-helpers), unifying on one orchard node.
voting-circuits = { version = "0.8.0", git = "https://github.com/valargroup/voting-circuits", branch = "adam/qrorchard-protocol-api" }
nonempty = "0.11"
zip32 = "0.2"
incrementalmerkletree = "0.8"

# librustzcash pins — valargroup/librustzcash `adam/pczt-optional-fields`
# (optional Orchard PCZT fields foundation). All six crates must share one git
# source so the graph has a single zcash_protocol / zcash_primitives / pczt node.
zcash_protocol = { version = "0.9", git = "https://github.com/valargroup/librustzcash", branch = "adam/pczt-optional-fields" }
zcash_client_backend = { version = "0.23", git = "https://github.com/valargroup/librustzcash", branch = "adam/pczt-optional-fields", default-features = false, features = ["orchard"] }
zcash_client_sqlite = { version = "0.21", git = "https://github.com/valargroup/librustzcash", branch = "adam/pczt-optional-fields", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.14", git = "https://github.com/valargroup/librustzcash", branch = "adam/pczt-optional-fields", features = ["orchard"] }
pczt = { version = "0.7", git = "https://github.com/valargroup/librustzcash", branch = "adam/pczt-optional-fields", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_primitives = { version = "0.28", git = "https://github.com/valargroup/librustzcash", branch = "adam/pczt-optional-fields" }
uuid = "1.23.1"
base64 = "0.22.1"

[dev-dependencies]
secrecy = "0.8"
