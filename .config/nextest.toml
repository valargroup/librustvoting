# Test-runner profiles shared by local development and CI.
#
# Select with `cargo nextest run -P <profile>`. The Makefile defaults to
# `agent`; CI uses `ci`.

# The three staging matrices must never run at the same time. Round creation
# serialises chain-wide, a delegation is consumed on the vote chain and cannot
# be replayed, and each matrix drives the shared voter wallet — so two of them
# provisioning concurrently would either deadlock on the chain's single pending
# ceremony or assert against each other's rounds.
#
# nextest runs separate test binaries in parallel by default, and there was only
# ever one such binary before the hang and fleet axes existed. This group is
# what keeps that assumption true now that there are three.
[test-groups]
staging-matrices = { max-threads = 1 }

[profile.default]
# `slow-timeout` is the guard against wedged loopback-socket tests
# (zcash_voting/src/http_transport.rs and tests/support/helper_fleet.rs, which
# scripts deliberate stall responses). Without it a stuck test hangs forever.
slow-timeout = { period = "30s", terminate-after = 4 }

# Reports failures only. The default profile prints a line per passing test,
# which floods an agent's context on a suite this size.
[profile.agent]
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate-final"
success-output = "never"
fail-fast = true
slow-timeout = { period = "20s", terminate-after = 4 }

# Runs the whole suite so one failure does not mask the rest.
[profile.ci]
status-level = "fail"
final-status-level = "flaky"
failure-output = "immediate-final"
success-output = "never"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The Halo2 proof tests run keygen plus proving and are slow even in release.
[[profile.ci.overrides]]
filter = 'test(/real_delegation_proof|zkp2/)'
slow-timeout = { period = "300s", terminate-after = 4 }

# The three staging matrices drive real rounds: they provision on chain,
# wait for a validator ceremony, generate Halo2 proofs, and crash, stall, and
# resume child processes. One stage can legitimately take tens of minutes, so
# the ordinary slow-timeout — 20s x 4 on the `agent` profile — would terminate
# them long before they could reach a verdict, and every result would be a
# timeout rather than a conformance answer.
#
# `terminate-after` is deliberately omitted: each matrix bounds itself per
# exercise and kills its own children, and a runner-level kill would strand a
# child holding a sidecar whose submission row is the only record that a
# transaction may exist. This matters most for the stall matrix, whose whole
# subject is a run that may not end on its own: it must be the matrix that
# observes and reports that, not the runner that silently kills it.
[[profile.default.overrides]]
filter = 'binary(staging_conformance) or binary(stall_conformance) or binary(helper_fleet_conformance)'
slow-timeout = { period = "10m" }
test-group = 'staging-matrices'

[[profile.agent.overrides]]
filter = 'binary(staging_conformance) or binary(stall_conformance) or binary(helper_fleet_conformance)'
slow-timeout = { period = "10m" }
test-group = 'staging-matrices'

[[profile.ci.overrides]]
filter = 'binary(staging_conformance) or binary(stall_conformance) or binary(helper_fleet_conformance)'
slow-timeout = { period = "10m" }
test-group = 'staging-matrices'

# Real proof/cache resource conformance and opt-in release benchmarks.
[[profile.default.overrides]]
filter = 'test(/real_delegation_proof|zkp2|cold_caches|bundle_pipeline_benchmark/)'
slow-timeout = { period = "300s", terminate-after = 4 }
