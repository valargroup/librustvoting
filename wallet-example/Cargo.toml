[package]
name = "zcash-voting-wallet-example"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["upstream"]
upstream = ["dep:zcash_voting", "voting-crypto-deps/upstream"]
zakura = ["dep:zcash_voting_zakura", "voting-crypto-deps/zakura"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
rand = "0.8"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voting-crypto-deps = { workspace = true }
zcash_protocol = { workspace = true }
# Mutually exclusive backends; the active one is bound to the extern name
# `zcash_voting` (see `src/lib.rs`).
zcash_voting = { path = "../zcash_voting", optional = true }
zcash_voting_zakura = { package = "zcash_voting-zakura", path = "../zcash_voting-zakura", optional = true }
zip32 = "0.2"
